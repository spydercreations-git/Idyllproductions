        /* Contextual preview animation - starts from clicked card, ends at viewport center */
        @keyframes contextual-preview {
          0% {
            left: var(--origin-x);
            top: var(--origin-y);
            transform: translate(-50%, -50%) scale(0.1);
            opacity: 0;
            border-radius: 12px;
          }
          60% {
            left: calc(50vw + var(--scroll-x));
            top: calc(50vh + var(--scroll-y));
            transform: translate(-50%, -50%) scale(1.02);
            opacity: 1;
            border-radius: 12px;
          }
          100% {
            left: calc(50vw + var(--scroll-x));
            top: calc(50vh + var(--scroll-y));
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            border-radius: 12px;

        .animate-contextual-preview {
          animation: contextual-preview 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
          position: absolute;
        }

        /* Close animation - reverse of contextual preview */
        @keyframes contextual-close {
          0% {
            left: calc(50vw + var(--scroll-x));
            top: calc(50vh + var(--scroll-y));
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            border-radius: 12px;
          }
          40% {
            left: calc(50vw + var(--scroll-x));
            top: calc(50vh + var(--scroll-y));
            transform: translate(-50%, -50%) scale(0.95);
            opacity: 0.8;
            border-radius: 12px;
          }
          100% {
            left: var(--origin-x);
            top: var(--origin-y);
            transform: translate(-50%, -50%) scale(0.1);
            opacity: 0;
            border-radius: 12px;
          }
        }

        .animate-contextual-close {
          animation: contextual-close 0.25s cubic-bezier(0.64, 0, 0.78, 0) forwards;

        /* 3D Models CSS */
        .floating-3d-cube {
          perspective: 1000px;
          animation: float 6s ease-in-out infinite;
        }

        .cube {
          position: relative;
          width: 100%;
          height: 100%;
          transform-style: preserve-3d;
          animation: rotateCube 10s infinite linear;
        }

        .face {
          position: absolute;
          width: 64px;
          height: 64px;
          background: linear-gradient(45deg, rgba(37, 99, 235, 0.8), rgba(59, 130, 246, 0.6));
          border: 2px solid rgba(37, 99, 235, 0.3);
          backdrop-filter: blur(10px);
        }

        .front { transform: rotateY(0deg) translateZ(32px); }
        .back { transform: rotateY(180deg) translateZ(32px); }
        .right { transform: rotateY(90deg) translateZ(32px); }
        .left { transform: rotateY(-90deg) translateZ(32px); }
        .top { transform: rotateX(90deg) translateZ(32px); }
        .bottom { transform: rotateX(-90deg) translateZ(32px); }

        .floating-3d-pyramid {
          perspective: 1000px;
          animation: float 8s ease-in-out infinite reverse;
        }

        .pyramid {
          position: relative;
          width: 100%;
          height: 100%;
          transform-style: preserve-3d;
          animation: rotatePyramid 12s infinite linear;
        }

        .pyramid-face {
          position: absolute;
          background: linear-gradient(45deg, rgba(34, 197, 94, 0.8), rgba(74, 222, 128, 0.6));
          border: 2px solid rgba(34, 197, 94, 0.3);
          backdrop-filter: blur(10px);
        }

        .pyramid-front {
          width: 48px;
          height: 48px;
          transform: rotateY(0deg) translateZ(24px);
          clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .pyramid-right {
          width: 48px;
          height: 48px;
          transform: rotateY(90deg) translateZ(24px);
          clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .pyramid-back {
          width: 48px;
          height: 48px;
          transform: rotateY(180deg) translateZ(24px);
          clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .pyramid-left {
          width: 48px;
          height: 48px;
          transform: rotateY(-90deg) translateZ(24px);
          clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .floating-3d-sphere {
          perspective: 1000px;
          animation: float 7s ease-in-out infinite;
        }

        .sphere {
          width: 56px;
          height: 56px;
          border-radius: 50%;
          background: radial-gradient(circle at 30% 30%, rgba(168, 85, 247, 0.9), rgba(147, 51, 234, 0.7));
          border: 2px solid rgba(168, 85, 247, 0.3);
          backdrop-filter: blur(10px);
          animation: rotateSphere 8s infinite linear;
          box-shadow: 
            inset -10px -10px 20px rgba(0, 0, 0, 0.2),
            inset 10px 10px 20px rgba(255, 255, 255, 0.1);
        }

        .floating-3d-cylinder {
          perspective: 1000px;
          animation: float 9s ease-in-out infinite;
        }

        .cylinder {
          position: relative;
          width: 100%;
          height: 100%;
          transform-style: preserve-3d;
          animation: rotateCylinder 15s infinite linear;
        }

        .cylinder-top, .cylinder-bottom {
          position: absolute;
          width: 40px;
          height: 40px;
          border-radius: 50%;
          background: linear-gradient(45deg, rgba(249, 115, 22, 0.8), rgba(251, 146, 60, 0.6));
          border: 2px solid rgba(249, 115, 22, 0.3);
          left: 50%;
          transform: translateX(-50%);
        }

        .cylinder-top {
          top: 0;
          transform: translateX(-50%) rotateX(90deg) translateZ(20px);
        }

        .cylinder-bottom {
          bottom: 0;
          transform: translateX(-50%) rotateX(-90deg) translateZ(20px);
        }

        .cylinder-side {
          position: absolute;
          width: 40px;
          height: 64px;
          background: linear-gradient(90deg, rgba(249, 115, 22, 0.8), rgba(251, 146, 60, 0.6));
          border: 2px solid rgba(249, 115, 22, 0.3);
          border-radius: 20px;
          left: 50%;
          transform: translateX(-50%);
        }

        /* 3D Animations */
        @keyframes rotateCube {
          0% { transform: rotateX(0deg) rotateY(0deg); }
          100% { transform: rotateX(360deg) rotateY(360deg); }

        @keyframes rotatePyramid {
          0% { transform: rotateX(0deg) rotateY(0deg); }

    <script>
        (function() {
            // Only run on non-touch devices
            if ('ontouchstart' in window) return;
            
            const cursor = document.createElement('div');

            cursor.className = 'custom-cursor';
            cursorDot.className = 'custom-cursor-dot';
            
            let mouseX = 0, mouseY = 0;
            let cursorX = 0, cursorY = 0;
            let dotX = 0, dotY = 0;
            
            // Add cursor elements when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.appendChild(cursor);
                    document.body.appendChild(cursorDot);
                });
            } else {
                document.body.appendChild(cursor);
                document.body.appendChild(cursorDot);
            }
            
            // Track mouse position
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            
            // Smooth cursor animation
            function animateCursor() {
                // Smooth follow for main cursor (slower)
                cursorX += (mouseX - cursorX) * 0.15;
                cursorY += (mouseY - cursorY) * 0.15;
                
                // Faster follow for dot
                dotX += (mouseX - dotX) * 0.25;
                dotY += (mouseY - dotY) * 0.25;
                
                cursor.style.left = cursorX + 'px';
                cursor.style.top = cursorY + 'px';
                cursorDot.style.left = dotX + 'px';
                cursorDot.style.top = dotY + 'px';
                
                requestAnimationFrame(animateCursor);
            }
            
            animateCursor();
            
            // Add hover effect for clickable elements
            const clickableElements = 'a, button, input[type="submit"], input[type="button"], [role="button"], .cursor-pointer';
            
            document.addEventListener('mouseover', function(e) {
                if (e.target.closest(clickableElements)) {
                    cursor.classList.add('hover');
                }
            });
            
            document.addEventListener('mouseout', function(e) {
                if (e.target.closest(clickableElements)) {
                    cursor.classList.remove('hover');
                }
            });
            
            // Hide cursor when leaving window
            document.addEventListener('mouseleave', function() {
                cursor.style.opacity = '0';
                cursorDot.style.opacity = '0';
            });
            
            document.addEventListener('mouseenter', function() {
                cursor.style.opacity = '0.8';
                cursorDot.style.opacity = '1';

        })();
