[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# 301 Redirect old domain idyllproductions.in to idyllproductions.com
[[redirects]]
  from = "https://idyllproductions.in/*"
  to = "https://idyllproductions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://idyllproductions.in/*"
  to = "https://idyllproductions.com/:splat"
  status = 301
  force = true

# Serve sitemap.xml and robots.txt as static files
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

# Proxy Resend API requests to avoid CORS
[[redirects]]
  from = "/api/resend/*"
  to = "https://api.resend.com/:splat"
  status = 200
  force = true

# Custom 404 fallback for URLs that do not exist (returns 404 HTTP status)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Proper content type for sitemap and robots
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"